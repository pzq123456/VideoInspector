# =============================================================================
# 安全帽 / 反光衣检测服务端 配置文件（DeepStream 三模型整帧检测 + 二级分类器）
# =============================================================================
# 修改此文件后重启服务即可生效，无需改动任何代码。
#
# 告警策略按规则（rule）独立配置，互不竞争:
#   rules.<rule>.cooldown_seconds    触发后冷却时长（秒）
#   rules.<rule>.min_detection_count 连续违规帧数阈值（防单帧误报）
#   rules.<rule>.attribute_threshold 违规置信度门限（同时作为 helmet 空间关联门限）
#   每路摄像头用 active_rules 声明跟踪哪些规则，只计算/判定激活的维度。
# =============================================================================

# -----------------------------------------------------------------------------
# 模型参数（两阶段 DeepStream 推理）
#   第一阶段·整帧检测（primary GIE）:
#     pgie   → 人体检测（yolo26n, person 类, uid=1）
#     helmet → 安全帽整帧检测（head/helmet, uid=3）
#   第二阶段·二级分类器（secondary GIE, process-mode=2, 裁剪 person 整框）:
#     harness_cls → 安全带 2 类分类器（uid=5）
#     vest_cls    → 反光衣 2 类分类器（uid=6）
# 配置为 INI 文本（路径可相对项目根目录解析），INI 内部引用的模型路径同样
# 相对根目录，启动时由 server/main.py 统一锚定为绝对路径（开发容器 /
# 生产镜像 /app 通用）。引擎/parser 复用根目录 models/ 已有产物。
# -----------------------------------------------------------------------------
model:
  pgie_config: "configs/pgie_config_person.txt"       # 人体检测（整帧, uid=1）
  helmet_config: "configs/pgie_config_helmet.txt"     # 安全帽（整帧, uid=3）
  harness_cls_config: "configs/sgie_config_harness_cls.txt"  # 安全带分类器（二级, uid=5）
  vest_cls_config: "configs/sgie_config_vest_cls.txt"        # 反光衣分类器（二级, uid=6）
  person_conf_threshold: 0.6     # person 检测置信度门槛，低于此视为噪声（不判定、不渲染、不告警）

# -----------------------------------------------------------------------------
# 告警规则（每条规则独立状态机: 冷却 / 连续帧确认 / 违规置信度门限）
# -----------------------------------------------------------------------------
# harness/vest 二级分类器的 classifier-threshold 由对应规则的
# attribute_threshold 启动时重写进 sgie INI；no_helmet 的
# attribute_threshold 同时作为 helmet 框匹配 person 的空间关联门限。
rules:
  no_helmet:
    cooldown_seconds: 10
    min_detection_count: 3
    attribute_threshold: 0.5

  no_vest:
    cooldown_seconds: 15
    min_detection_count: 5
    attribute_threshold: 0.5

  no_harness:
    cooldown_seconds: 5
    min_detection_count: 2
    attribute_threshold: 0.5

# -----------------------------------------------------------------------------
# Webhook 告警推送（alert_type 为触发的规则名，如 "no_vest"）
# -----------------------------------------------------------------------------
webhook:
  url: "http://localhost:9999/api/ppe-alert"   # Webhook 接收地址
  timeout: 10                                   # 请求超时（秒）
  retries: 2                                    # 失败重试次数

# -----------------------------------------------------------------------------
# 摄像头列表
# -----------------------------------------------------------------------------
# 多路 RTSP 输入（引擎为动态 batch，支持任意路数；每路一个 AlertManager）。
# active_rules 只声明本路要判定/计算/渲染的规则（引用 rules 节的名称）。
cameras:
  - id: "1363"
    name: "Mobile Camera 1363"
    rtsp_url: "rtsp://118.140.234.166:8554/dahua1001182"
    enabled: true
    active_rules: ["no_helmet", "no_vest", "no_harness"]

  - id: "1384"
    name: "Mobile Camera 1384"
    rtsp_url: "rtsp://118.140.234.166:8554/dahua1001204"
    enabled: true
    active_rules: ["no_helmet", "no_vest", "no_harness"]

  - id: "1385"
    name: "Mobile Camera 1385"
    rtsp_url: "rtsp://118.140.234.166:8554/dahua1001723"
    enabled: true
    active_rules: ["no_helmet", "no_vest", "no_harness"]

  - id: "671"
    name: "Mobile Camera 0671"
    rtsp_url: "rtsp://118.140.234.166:8554/dahua1000330"
    enabled: true
    active_rules: ["no_helmet"]

  - id: "676"
    name: "Mobile Camera 0676"
    rtsp_url: "rtsp://118.140.234.166:8554/dahua1000325"
