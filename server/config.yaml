# =============================================================================
# 安全帽 / 反光衣检测服务端 配置文件（DeepStream 三模型整帧检测）
# =============================================================================
# 修改此文件后重启服务即可生效，无需改动任何代码。
# =============================================================================

# -----------------------------------------------------------------------------
# 模型参数（三阶段 DeepStream 推理）
#   pgie   → 人体检测（yolo26n, person 类, uid=1）
#   helmet → 安全帽整帧检测（head/helmet, uid=3）
#   vest   → 反光衣整帧检测（vest/no_vest, uid=4）
# 配置为 INI 文本（路径可相对项目根目录解析），INI 内部引用的模型路径同样
# 相对根目录，启动时由 server/main.py 统一锚定为绝对路径（开发容器 /
# 生产镜像 /app 通用）。引擎/parser 复用根目录 models/ 已有产物。
# -----------------------------------------------------------------------------
model:
  pgie_config: "configs/pgie_config_person.txt"    # 人体检测
  helmet_config: "configs/pgie_config_helmet.txt"  # 安全帽
  vest_config: "configs/pgie_config_vest.txt"      # 反光衣

# -----------------------------------------------------------------------------
# 摄像头列表
# -----------------------------------------------------------------------------
# 多路 RTSP 输入（引擎为动态 batch，支持任意路数；每路一个 AlertManager）。
# type=rtsp 时需填 rtsp_url。
cameras:
  - id: "1363"
    name: "Mobile Camera 1363"
    type: "rtsp"
    rtsp_url: "rtsp://118.140.234.166:8554/dahua1001182"
    enabled: true
  - id: "1384"
    name: "Mobile Camera 1384"
    type: "rtsp"
    rtsp_url: "rtsp://118.140.234.166:8554/dahua1001204"
    enabled: true
  - id: "1385"
    name: "Mobile Camera 1385"
    type: "rtsp"
    rtsp_url: "rtsp://118.140.234.166:8554/dahua1001723"
    enabled: true
  - id: "671"
    name: "Mobile Camera 0671"
    type: "rtsp"
    rtsp_url: "rtsp://118.140.234.166:8554/dahua1000330"
    enabled: true
  - id: "676"
    name: "Mobile Camera 0676"
    type: "rtsp"
    rtsp_url: "rtsp://118.140.234.166:8554/dahua1000325"
    enabled: true
  - id: "891"
    name: "Mobile Camera 0891"
    type: "rtsp"
    rtsp_url: "rtsp://118.140.234.166:8554/dahua1000352"
    enabled: true

# -----------------------------------------------------------------------------
# 告警参数
# -----------------------------------------------------------------------------
alert:
  alert_type: "ppe"          # 与平台约定的告警类型（场景级，随 payload 原样输出）；和 target_classes 一起换
  target_classes: ['no_helmet', 'no_vest']  # 触发告警的违规属性名（匹配 ObjectMeta.attributes）
  cooldown_seconds: 10           # 同一摄像头两次告警的最小间隔（秒）
  min_detection_count: 3         # 连续检测到违规的帧数阈值（防止单帧误报）
  save_frame_overlay: false      # 是否在证据帧上叠加摄像头名称/时间水印（证据帧已启用，告警带图）
  helmet_conf_threshold: 0.5     # 头盔框匹配 person 的最低置信度
  vest_conf_threshold: 0.8       # 反光衣框匹配 person 的最低置信度

  webhook:
    # url: "http://192.168.1.24:6034/protal/smoking-alarm/webhook"
    url: "http://localhost:9999/api/smoke-alert"   # Webhook 接收地址
    timeout: 10                                     # 请求超时（秒）
    retries: 2                                      # 失败重试次数

# -----------------------------------------------------------------------------
# RTSP 输出（替代原 MJPEG 预览；注释掉 output 节即关闭）
# -----------------------------------------------------------------------------
# 单端口 RTSP 服务：所有摄像头共用 rtsp_port，通过挂载点路径区分。
#   播放地址（示例）:
#     rtsp://localhost:8554/cam/1363
#     rtsp://localhost:8554/cam/1384
#     ... 依此类推（camera_id 与 cameras 列表一一对应）
output:
  rtsp_port: 8554            # 单一 RTSP 服务端口（所有摄像头共用）
  mount_prefix: /cam         # 挂载点前缀，每路 = /cam/<camera_id>
  codec: h264                # 输出编码: h264 / h265
  bitrate: 4000000           # 编码码率 (bps)
  idrinterval: 30            # 关键帧间隔（帧）

# -----------------------------------------------------------------------------
# 日志参数
# -----------------------------------------------------------------------------
log:
  level: "INFO"                # DEBUG / INFO / WARNING / ERROR
  file: "logs/server.log"      # 日志文件路径（JSON 格式，自动轮转 10MB，保留 30 天）
