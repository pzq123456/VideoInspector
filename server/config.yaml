  # --- 本地摄像头（USB / 内置），测试用 ---
  - id: "local_webcam"
    name: "本地摄像头"
    type: "local"
    device_id: 0                                                     # 0=默认摄像头
    enabled: true

# -----------------------------------------------------------------------------
# 告警参数
# -----------------------------------------------------------------------------
alert:
  cooldown_seconds: 10           # 同一摄像头两次告警的最小间隔（秒）
  min_detection_count: 3         # 连续检测到抽烟的帧数阈值（防止单帧误报）
  save_frame_overlay: false      # 是否在证据帧上叠加摄像头名称/时间水印（摄像头流已自带则无需）

  webhook:
    # url: "http://192.168.1.24:6034/protal/smoking-alarm/webhook"
    url: "http://localhost:9999/api/smoke-alert"   # Webhook 接收地址
    timeout: 10                                     # 请求超时（秒）
    retries: 2                                      # 失败重试次数

# -----------------------------------------------------------------------------
# 视频流预览（可选）
# -----------------------------------------------------------------------------
# 取消注释即启用 MJPEG 实时视频流；注释掉即关闭。
preview:
  host: "0.0.0.0"
  port: 8080
  jpeg_quality: 30

# -----------------------------------------------------------------------------
# 日志参数
# -----------------------------------------------------------------------------
log:
  level: "INFO"                # DEBUG / INFO / WARNING / ERROR
  file: "logs/server.log"      # 日志文件路径（JSON 格式，自动轮转 10MB，保留 30 天）
