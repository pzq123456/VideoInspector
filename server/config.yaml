# =============================================================================
# 安全帽 / 反光衣检测服务端 配置文件（DeepStream 三模型整帧检测）
# =============================================================================
# 修改此文件后重启服务即可生效，无需改动任何代码。
# =============================================================================

# -----------------------------------------------------------------------------
# 模型参数（三阶段 DeepStream 推理）
#   pgie   → 人体检测（yolo26n, person 类, uid=1）
#   helmet → 安全帽整帧检测（head/helmet, uid=3）
#   vest   → 反光衣整帧检测（vest/no_vest, uid=4）
# 配置为 INI 文本（路径可相对项目根目录解析），引擎/parser 复用
# simple-demo3 已有产物，无需重复导出。
# -----------------------------------------------------------------------------
model:
  pgie_config: "simple-demo3/configs/pgie_config_yolo26n.txt"   # 人体检测
  helmet_config: "simple-demo3/configs/pgie_config_helmet.txt"  # 安全帽
  vest_config: "simple-demo3/configs/pgie_config_vest.txt"      # 反光衣

# -----------------------------------------------------------------------------
# 摄像头列表
# -----------------------------------------------------------------------------
# 注意：当前三个引擎均为 batch=1，仅支持 1 路 RTSP 输入；
#       多路需用 batch=N 重建引擎（见 server/README.md）。
# type=rtsp 时需填 rtsp_url。
cameras:
  - id: "1363"
    name: "Mobile Camera 1363"
    type: "rtsp"
    rtsp_url: "rtsp://118.140.234.166:8554/dahua1000352"
    # rtsp://118.140.234.166:8554/dahua1000330
    # rtsp_url: "rtsp://118.140.234.166:8554/dahua1000330"
    enabled: true

# -----------------------------------------------------------------------------
# 告警参数
# -----------------------------------------------------------------------------
alert:
  alert_type: "ppe"          # 与平台约定的告警类型（场景级，随 payload 原样输出）；和 target_classes 一起换
  target_classes: ['no_helmet', 'no_vest']  # 触发告警的违规属性名（匹配 ObjectMeta.attributes）
  cooldown_seconds: 10           # 同一摄像头两次告警的最小间隔（秒）
  min_detection_count: 3         # 连续检测到违规的帧数阈值（防止单帧误报）
  save_frame_overlay: false      # 是否在证据帧上叠加摄像头名称/时间水印（证据帧已启用，告警带图）

  webhook:
    # url: "http://192.168.1.24:6034/protal/smoking-alarm/webhook"
    url: "http://localhost:9999/api/smoke-alert"   # Webhook 接收地址
    timeout: 10                                     # 请求超时（秒）
    retries: 2                                      # 失败重试次数

# -----------------------------------------------------------------------------
# RTSP 输出（替代原 MJPEG 预览；注释掉 output 节即关闭）
# -----------------------------------------------------------------------------
output:
  rtsp_port: 18003          # 输出流监听端口（本地转发该端口后观看）
  mount_point: /vest        # 播放地址: rtsp://localhost:18003/vest
  codec: h264               # 输出编码: h264 / h265
  bitrate: 4000000          # 编码码率 (bps)
  idrinterval: 30           # 关键帧间隔（帧）

# -----------------------------------------------------------------------------
# 日志参数
# -----------------------------------------------------------------------------
log:
  level: "INFO"                # DEBUG / INFO / WARNING / ERROR
  file: "logs/server.log"      # 日志文件路径（JSON 格式，自动轮转 10MB，保留 30 天）
