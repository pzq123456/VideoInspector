services:
  detector:
    build:
      context: ..
      dockerfile: Dockerfile
    image: safety-detector:latest
    container_name: safety-detector
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - SAFETY_LOG_FILE=/logs/server.log   # 日志落到宿主机映射的 deploy/logs/
    shm_size: "1g"

    volumes:
      - ./logs:/logs

    ports:
      - "18003:18003/tcp"
      - "18004-18020:18004-18020/udp"
    restart: unless-stopped
