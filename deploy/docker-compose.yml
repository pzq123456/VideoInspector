services:
  detector:
    build:
      context: ..
      dockerfile: Dockerfile
    image: safety-detector:latest
    container_name: safety-detector
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - SAFETY_LOG_FILE=/logs/server.log   # 日志落到宿主机映射的 deploy/logs/
    shm_size: "1g"

    volumes:
      - ../models:/app/models     # 模型产物（引擎/parser/labels）——宿主机构建, 重启容器即加载新模型
      - ../configs:/app/configs   # 生成的 nvinfer 配置
      - ./logs:/logs

    ports:
      - "18003:18003/tcp"
      - "18004-18020:18004-18020/udp"
    restart: unless-stopped
