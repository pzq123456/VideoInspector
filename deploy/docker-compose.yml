services:
  detector:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: safety-detector:latest
    pull_policy: build
    container_name: safety-detector
    runtime: nvidia
    privileged: true
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video,display  
    shm_size: "1g"

    volumes:
      - ./config.yaml:/app/deploy/config.yaml:ro
      - ./models:/app/deploy/models:ro
      - ./generated:/app/deploy/generated
      - ./logs:/app/deploy/logs

    ports:
      - "18003:8554/tcp"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - safety-net

    restart: unless-stopped

  alert-receiver:
    image: python:3.11-slim          # 轻量接收端：python + loguru 足矣，勿复用主推理镜像
    container_name: alert-receiver
    profiles: ["soak"]
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir loguru==0.7.3 &&
             python3 -u /app/receiver.py --port 9999 --save-dir /app/alerts"
    volumes:
      - ../local/webhook_receiver.py:/app/receiver.py:ro
      - ./alerts:/app/alerts
    networks:
      - safety-net
    restart: unless-stopped

networks:
  safety-net:
    driver: bridge