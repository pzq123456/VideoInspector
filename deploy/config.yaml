# =============================================================================
# 安全帽 / 反光衣 / 安全带检测服务端 配置文件
# =============================================================================
# 本文件是「部署根」：所有相对路径（source 等）均相对本文件所在目录解析，
# 产物统一写入 ./generated/。修改此文件后:
#   1. python tools/model_build.py --config deploy/config.yaml   # 编译模型产物（增量，--force 全量重建）
#   2. python -m server.main --config deploy/config.yaml          # 启动服务
#
# model.gies 是模型拓扑的单一事实来源，每项声明:
#   kind      detector(整帧检测) | classifier(二级分类，作用于 person 裁剪框)
#   attach    二级检测器专用：附属的锚点 gie 名（如 person），声明后该 detector
#             以 process-mode=2 在锚点检出框上推理（如抽烟检测）；空 = 整帧
#   source    模型来源 .pt（编译入口，相对本文件所在目录）
#   uid       gie-unique-id（全局唯一）
#   violation 报警类标签（只写报警类，如 head/no_vest/no_harness/cigarette；锚点无此字段）
#             classifier 若 violation 不在 index0，构建工具自动交换输出通道使其落到 class0
# rules 每条独立状态机（冷却 / 连续帧确认 / 违规置信度门限），gie 引用上面的模型名。
# =============================================================================

model:
  person_conf_threshold: 0.6     # person 检测置信度门槛，低于视为噪声（不判定、不渲染、不告警）
  gies:
    person:                                    # 锚点检测器（不告警）
      kind: detector
      source: models/person/yolo26n.pt
      uid: 1

    helmet:                                    # 安全帽整帧检测
      kind: detector
      source: models/helmet/yolo26s_helm_20260804_0844/weights/best.pt
      uid: 3
      violation: head                          # head = 未戴帽（报警类）

    harness_cls:                               # 安全带二级分类器
      kind: classifier
      source: models/harness/yolo26m_cls_harness_20260817_0547/weights/best.pt
      uid: 5
      violation: no_harness                    # 原 index1 → 构建期自动换到 class0

    vest_cls:                                  # 反光衣二级分类器（新模型，修复 §6 预处理脆弱）
      kind: classifier
      source: models/vest/yolo26mcls_ppeVest_20260902_0954/weights/best.pt
      uid: 6
      violation: no_vest                       # 原 index0，无需交换

    smoke:                                     # 抽烟二级检测器（附属在 person 裁剪框上检测）
      kind: detector
      attach: person                           # 二级：裁剪锚点(person)检出框送检
      source: models/smoke/yolo26m_smoking_20260707_0224/weights/best.pt
      uid: 7
      violation: cigarette                     # 单类模型，cigarette 即报警类

# -----------------------------------------------------------------------------
# 告警规则（每条规则独立状态机；gie 引用 model.gies 的名称）
#   classifier 的 classifier-threshold 由 attribute_threshold 启动时重写进 INI；
#   detector 的 attribute_threshold 同时作为空间关联门限。
# -----------------------------------------------------------------------------
rules:
  no_helmet:
    gie: helmet
    cooldown_seconds: 10
    min_detection_count: 3
    attribute_threshold: 0.5

  no_vest:
    gie: vest_cls
    cooldown_seconds: 30
    min_detection_count: 10
    attribute_threshold: 0.7

  no_harness:
    gie: harness_cls
    cooldown_seconds: 30
    min_detection_count: 5
    attribute_threshold: 0.7

  smoking:
    gie: smoke
    cooldown_seconds: 30
    min_detection_count: 3
    attribute_threshold: 0.7

# -----------------------------------------------------------------------------
# Webhook 告警推送（alert_type 为触发的规则名，如 "no_vest"）
# -----------------------------------------------------------------------------
webhook:
  url: "http://192.168.1.24:6034/protal/ai-alarm/webhook"   # 浸泡测试接收端（compose 内网服务名）
  # 需搭配 --profile soak 启动 alert-receiver；接下游时改为真实完整地址即可
  timeout: 10                                   # 请求超时（秒）
  retries: 2                                    # 失败重试次数

